server:
  port: ${SERVER_PORT:8090}

spring:
  cache:
    type: caffeine
    caffeine:
      spec: initialCapacity=100,maximumSize=3000,expireAfterWrite=10m
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:supermarket}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=120000&socketTimeout=180000&tcpKeepAlive=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 90000
      maximum-pool-size: 10
      keepalive-time: 300000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

app:
  super-admin-username: ${SUPER_ADMIN_USERNAME:}

rsa:
    public-key: ${RSA_PUBLIC_KEY:}
    private-key: ${RSA_PRIVATE_KEY:}



file:
  upload-dir: D:/SoftTrain/backend/uploads

alipay:
  app-id: 9021000162628691
  private-key: 
  alipay-public-key: 
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://localhost:${server.port}/api/pay/notify
  return-url: http://localhost:5173/pay-result
